<div class="page">
  <header class="hero">
    <div>
      <p class="eyebrow">Financial Doc Intelligence</p>
      <h1>Evidence-first answers from filings and research.</h1>
      <p class="subhead">
        Upload reports, index the corpus, and ask for grounded summaries, comparisons, or chart-ready findings.
      </p>
    </div>
  </header>

  <section class="section">
    <div class="section-heading">
      <h2>Workspace</h2>
      <p>Run ingestion and query workflows in dedicated tabs.</p>
    </div>
    <div class="split">
      <div class="left-panel">
        <mat-tab-group class="tabs" animationDuration="0ms">
          <mat-tab label="Upload">
            <mat-card class="tab-card">
              <app-upload [status]="uploadStatus" [loading]="uploadLoading" (upload)="submitUpload($event)"></app-upload>
            </mat-card>
          </mat-tab>
          <mat-tab label="Ask">
            <mat-card class="tab-card">
              <app-query [status]="responseStatus" [loading]="isLoading" (run)="runQuery($event)"></app-query>
            </mat-card>
          </mat-tab>
        </mat-tab-group>
      </div>
      <div class="right-panel">
        <app-indexing [status]="indexStatus" (start)="startIndex($event)"></app-indexing>
        <app-output [response]="response"></app-output>
      </div>
    </div>
  </section>
</div>
