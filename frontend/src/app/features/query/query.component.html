<article class="card wide">
  <div class="card-title">
    <h2>Ask a question</h2>
    <p>Run Q&A, summary, chart request, or comparison workflows.</p>
  </div>
  <div class="field-group">
    <label class="label">Question</label>
    <textarea [(ngModel)]="question" rows="4" placeholder="Summarize Tesla risk factors in the latest 10-K."></textarea>
  </div>
  <div class="field-row">
    <div class="field-group">
      <label class="label">Company</label>
      <input type="text" [(ngModel)]="questionCompany" placeholder="tesla" />
    </div>
    <div class="field-group">
      <label class="label">Year</label>
      <input type="number" [(ngModel)]="questionYear" placeholder="2023" />
    </div>
    <div class="field-group">
      <label class="label">Source</label>
      <select [(ngModel)]="questionSource">
        <option value="auto">auto</option>
        <option value="local">local</option>
        <option value="web">web</option>
      </select>
    </div>
    <div class="field-group">
      <label class="label">Intent</label>
      <select [(ngModel)]="questionIntent">
        <option value="qa">qa</option>
        <option value="summary">summary</option>
        <option value="chart_request">chart_request</option>
        <option value="comparative_analysis">comparative_analysis</option>
      </select>
    </div>
  </div>
  <div class="field-row">
    <div class="field-group">
      <label class="label">Top K</label>
      <input type="number" [(ngModel)]="topK" />
    </div>
    <div class="field-group">
      <label class="label">Final K</label>
      <input type="number" [(ngModel)]="finalK" />
    </div>
  </div>
  <div class="actions">
    <button class="secondary" (click)="submit('qa')" [disabled]="loading">Q&A</button>
    <button class="secondary" (click)="submit('summary')" [disabled]="loading">Summary</button>
    <button class="secondary" (click)="submit('chart')" [disabled]="loading">Chart</button>
    <button class="secondary" (click)="submit('compare')" [disabled]="loading">Compare</button>
  </div>
  <p class="status">{{ status }}</p>
</article>
