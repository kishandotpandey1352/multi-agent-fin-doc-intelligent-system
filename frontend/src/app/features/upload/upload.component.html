<article class="card">
  <div class="card-title">
    <h2>Upload PDF</h2>
    <p>Stage a new document into the data lake.</p>
  </div>
  <div class="field-group">
    <label class="label">PDF file</label>
    <input type="file" accept="application/pdf" (change)="onFileSelected($event)" />
  </div>
  <div class="field-row">
    <div class="field-group">
      <label class="label">Company</label>
      <select [(ngModel)]="uploadCompany">
        <option value="tesla">tesla</option>
        <option value="apple">apple</option>
        <option value="nvidia">nvidia</option>
        <option value="research">research</option>
      </select>
    </div>
    <div class="field-group">
      <label class="label">Source type</label>
      <select [(ngModel)]="uploadSourceType">
        <option value="annual">annual</option>
        <option value="earnings">earnings</option>
        <option value="presentations">presentations</option>
        <option value="research">research</option>
      </select>
    </div>
  </div>
  <div class="upload-actions">
    <button class="primary" (click)="submitUpload()" [disabled]="loading">Upload & stage</button>
    <span class="spinner" *ngIf="loading" aria-label="Uploading"></span>
  </div>
  <p class="status">{{ status }}</p>
</article>
